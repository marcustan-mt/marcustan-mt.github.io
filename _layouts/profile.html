---
layout: default
---
<div class="shell">
  {% include sidebar.html %}
  <main class="profile-main">
    <div class="profile-column">
      <h1 class="profile-name">{{ site.author.name }}</h1>
      <nav class="tabs">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>About</a>
        <a href="{{ '/writings/' | relative_url }}" {% if page.url == '/writings/' %}class="active"{% endif %}>Writings</a>
      </nav>
      {{ content }}
    </div>
  </main>
</div>
